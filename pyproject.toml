[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "allsense-testkit"
version = "0.1.0"
description = "Fake phones, reference codecs and conformance tests for the OtterBridge AllSense protocol."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "wen-da-ng" }]
keywords = ["robotics", "sensors", "android", "protocol", "testing", "websocket"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Hardware",
]
# The WebSocket fake phone and the conformance runner need only websockets.
dependencies = ["websockets>=12"]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]   # allsense-fake-serial, allsense-fake-template --port
ble = ["bleak>=0.21"]        # allsense-fake-ble, allsense-fake-template --ble
all = ["pyserial>=3.5", "bleak>=0.21"]
dev = ["pytest>=7"]

[project.scripts]
allsense-fake-phone = "allsense_testkit.fake_phone:main"
allsense-conformance = "allsense_testkit.conformance:main"
allsense-fake-serial = "allsense_testkit.serial_phone:main"
allsense-fake-ble = "allsense_testkit.ble_phone:cli"
allsense-fake-template = "allsense_testkit.template_phone:main"
allsense-template = "allsense_testkit.template:main"

[project.urls]
Source = "https://github.com/wen-da-ng/otterbridge-allsense-protocol"
Documentation = "https://docs.allsense.otterbridge.org/PROTOCOL/"

[tool.hatch.build.targets.wheel]
packages = ["src/allsense_testkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
